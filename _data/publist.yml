- title: "Data-Driven Whitney Forms for Structure-Preserving Control Volume Analysis"
  image: actor2024data.png
  description: We introduce a scientific machine learning framework adopting a partition of unity architecture to identify physically-relevant control volumes, with generalized fluxes between subdomains encoded via Whitney forms. The approach provides a differentiable parameterization of geometry which may be trained in an end-to-end fashion to extract reduced models from full field data while exactly preserving physics. 
  authors: Jonas A Actor, Xiaozhe Hu, Andy Huang, Scott A Roberts, Nathaniel Trask
  link:
    url: https://www.sciencedirect.com/science/article/abs/pii/S0021999123006150
    display: Journal of Computational Physics 496 (2024), 112520.
  highlight: 1

- title: "Unsupervised physics-informed disentanglement of multimodal data"
  image: walker2025unsupervised.jpg
  description: We introduce physics-informed multimodal autoencoders (PIMA) - a variational inference framework for discovering shared information in multimodal datasets. Individual modalities are embedded into a shared latent space and fused through a product-of-experts formulation, enabling a Gaussian mixture prior to identify shared features. 
  authors: Elise Walker, Nathaniel Trask, Carianne Martinez, Kookjin Lee, Jonas A Actor, Sourav Saha, Troy Shilt, Daniel Vizoso, Remi Dingreville, Brad L Boyce
  link:
    url: https://www.aimsciences.org/article/doi/10.3934/fods.2024019
    display: Foundations of Data Science 7.1 (2025), 418-445.
  highlight: 1
