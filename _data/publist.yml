- title: "Data-driven particle dynamics: Structure-preserving coarse-graining for emergent behavior in non-equilibrium systems"
  image: hernandez2025data.png
  description: Multiscale systems are difficult to simulate since fine-scale dynamics must be linked to emergent bulk physics. Coarse-graining high-dimensional dynamics inevitably produces dissipative, history-dependent, and stochastic behavior. We propose a metriplectic-bracket-based framework that learns such coarse-grained dynamics from particle trajectories while guaranteeing thermodynamic consistency, momentum conservation, and fluctuation–dissipation balance. A self-supervised strategy identifies emergent structural variables without labels. We validate the method on benchmark systems, star polymers, and colloidal suspensions, and release open-source implementations in PyTorch and LAMMPS for large-scale inference.
  authors: Quercus Hernandez, Max Win, Thomas C. O'Connor, Paulo E. Arratia, Nathaniel Trask
  link:
    url: https://arxiv.org/abs/2508.12569
    display: arXiv preprint, arXiv:2508.12569 (Under review)
  highlight: 1

- title: "Structure-Preserving Digital Twins via Conditional Neural Whitney Forms"
  image: kinch2025structure.png
  description: We propose a framework for real-time digital twins using structure-preserving reduced finite element models conditioned on a latent variable. Conditional attention learns both a reduced basis and nonlinear conservation laws within finite element exterior calculus, ensuring well-posedness and exact conservation despite sparse data. The method enables real-time calibration to sensor data, integrates seamlessly with standard finite element tools, and handles complex geometries. Benchmarks from advection–diffusion to battery thermal runaway show accurate predictions with only 25 LES simulations and real-time inference (~0.1s, 3.1×10^8 speedup).
  authors: Brooks Kinch, Benjamin Shaffer, Elizabeth Armstrong, Michael Meehan, John Hewson, Nathaniel Trask
  link:
    url: https://arxiv.org/abs/2508.06981
    display: arXiv preprint, arXiv:2508.06981 (Under review)
  highlight: 1

